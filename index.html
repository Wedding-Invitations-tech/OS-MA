<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe3d4" />
  <meta name="description" content="دعوة عقد قران عمر ومروة — Regal Plum Continuum" />
  <title>Omer & Marwa | Regal Plum Continuum</title>
  <link rel="preload" as="image" href="assets/cover.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/letters-mask.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/flap-top.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/paper-body.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/paper-flap.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/band-left.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/band-right.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/wash-left.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/wash-right.webp" type="image/webp" crossorigin />
  <link rel="preload" as="image" href="assets/continuum-scene-1.png" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/continuum-scene-2.png" />
  <link rel="preload" as="image" href="assets/continuum-scene-3.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="regal-plum-continuum.css" />
  <link rel="stylesheet" href="finishing-touches.css" />
  <link rel="stylesheet" href="soundtrack.css" />
  <script src="config.js" defer></script>
  <script src="soundtrack.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="is-locked plum-body">
  <noscript><div class="noscript">هذه الدعوة التفاعلية تحتاج إلى تفعيل JavaScript لفتح الظرف. <a href="#experience">تفاصيل الدعوة</a></div></noscript>

  <main id="experience" class="experience continuum-experience" aria-label="دعوة عقد قران عمر ومروة">
    <div class="continuum-scroll" id="continuumScroll">
      <div class="continuum-sticky">
        <div class="continuum-backdrop" aria-hidden="true">
          <!-- Full-bleed extensions of the same approved artwork; central page remains uncropped. -->
          <img class="ambient-scene ambient-scene--1" src="assets/continuum-scene-1.png" alt="" />
          <img class="ambient-scene ambient-scene--2" src="assets/continuum-scene-2.png" alt="" />
          <img class="ambient-scene ambient-scene--3" src="assets/continuum-scene-3.png" alt="" />
          <span class="ambient-soften"></span>
          <span class="backdrop-glow backdrop-glow--top"></span>
          <span class="backdrop-glow backdrop-glow--bottom"></span>
          <span class="backdrop-palm backdrop-palm--left"></span>
          <span class="backdrop-palm backdrop-palm--right"></span>
        </div>

        <div class="continuum-canvas" id="continuumCanvas" data-scene="1">
          <!-- Seam-matched edge artwork: fills the side gutters without cropping or scaling the invitation. -->
          <img class="edge-bleed edge-bleed--left edge-bleed--1" src="assets/scene-1-left-edge.png" alt="" aria-hidden="true" />
          <img class="edge-bleed edge-bleed--right edge-bleed--1" src="assets/scene-1-right-edge.png" alt="" aria-hidden="true" />
          <img class="edge-bleed edge-bleed--left edge-bleed--2" src="assets/scene-2-left-edge.png" alt="" aria-hidden="true" />
          <img class="edge-bleed edge-bleed--right edge-bleed--2" src="assets/scene-2-right-edge.png" alt="" aria-hidden="true" />
          <img class="edge-bleed edge-bleed--left edge-bleed--3" src="assets/scene-3-left-edge.png" alt="" aria-hidden="true" />
          <img class="edge-bleed edge-bleed--right edge-bleed--3" src="assets/scene-3-right-edge.png" alt="" aria-hidden="true" />
          <img class="scene-layer scene-layer--1 is-visible" src="assets/continuum-scene-1.png" alt="المشهد الأول: الدعوة" fetchpriority="high" decoding="async" />
          <img class="scene-layer scene-layer--2" src="assets/continuum-scene-2.png" alt="المشهد الثاني: التاريخ والمكان" loading="lazy" decoding="async" />
          <img class="scene-layer scene-layer--3" src="assets/continuum-scene-3.png" alt="المشهد الثالث: برنامج الحفل" loading="lazy" decoding="async" />
          <div class="map-placement">
            <a id="mapsLink" class="continuum-map-hotspot" href="#" aria-label="افتح موقع Le Ciel Hotel على خرائط Google" aria-disabled="true">
              <span class="map-button-visual" aria-hidden="true"></span>
            </a>
          </div>
          <!-- Brief upward-swipe cue; only visible during the last 3 seconds
               before an automatic transition from Scene 1 or Scene 2. -->
          <div class="swipe-cue-placement" aria-hidden="true">
            <div id="swipeCue" class="swipe-cue">
              <svg viewBox="0 0 76 100" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
                <path class="swipe-chevron swipe-chevron--1" d="M14 27 L38 7 L62 27" />
                <path class="swipe-chevron swipe-chevron--2" d="M14 56 L38 36 L62 56" />
                <path class="swipe-chevron swipe-chevron--3" d="M14 85 L38 65 L62 85" />
              </svg>
            </div>
          </div>
          <div class="scene-progress" aria-hidden="true">
            <span class="scene-progress__dot is-active" data-progress-dot="0"></span>
            <span class="scene-progress__dot" data-progress-dot="1"></span>
            <span class="scene-progress__dot" data-progress-dot="2"></span>
          </div>
          <div class="scene-hint" id="sceneHint">مرر لاكتشاف الدعوة</div>
        </div>
      </div>

      <section class="scene-step" data-step="0" aria-label="القسم الأول: الدعوة"></section>
      <section class="scene-step" data-step="1" aria-label="القسم الثاني: التاريخ والمكان"></section>
      <section class="scene-step" data-step="2" aria-label="القسم الثالث: برنامج الحفل"></section>
      <section class="scene-step scene-step--tail" aria-hidden="true"></section>
    </div>
  </main>

  <div id="envelope" class="envelope" role="dialog" aria-modal="true" aria-label="افتح دعوة عمر ومروة">
    <div class="envelope-ambient" aria-hidden="true"></div>
    <div class="envelope-card" id="envelopeCard" aria-hidden="true">
      <div class="reveal-light" aria-hidden="true"></div>
      <div class="reveal-light reveal-light--inner" aria-hidden="true"></div>

      <div class="envelope-piece envelope-piece--sheet"></div>

      <div class="seal-light-system" aria-hidden="true">
        <span class="seal-core"></span>
        <span class="seal-spill"></span>
      </div>

      <span class="flap-glow" aria-hidden="true"></span>
      <span class="paper-glow paper-glow--body" aria-hidden="true"></span>

      <div class="flap-top" aria-hidden="true">
        <span class="flap-top__art"></span>
        <span class="paper-glow paper-glow--flap"></span>
        <span class="seam-wash seam-wash--left"><i></i></span>
        <span class="seam-wash seam-wash--right"><i></i></span>
        <span class="orn-flow orn-flow--left"><i></i></span>
        <span class="orn-flow orn-flow--right"><i></i></span>
        <span class="letter-bloom"></span>
        <span class="letter-flare"><i class="letter-flare__mask"><i class="letter-flare__sweep"></i></i></span>
      </div>
    </div>

    <button id="openInvitation" class="seal-hotspot" type="button" aria-label="اضغط على ختم O and M لفتح الدعوة">
      <span class="sr-only">افتح الدعوة</span>
    </button>
  </div>

  <!-- Music is optional until an authorised recording is placed in assets/music/. -->
  <audio id="invitationSoundtrack" preload="auto" loop playsinline aria-hidden="true"></audio>
  <button id="soundtrackToggle" class="soundtrack-toggle" type="button" hidden aria-label="تشغيل الموسيقى" title="تشغيل الموسيقى">
    <svg class="soundtrack-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M8 5v11.5a3.5 3.5 0 1 0 2 3.15V8.1L19 6v8.5a3.5 3.5 0 1 0 2 3.15V3L8 5Z" fill="currentColor"/>
    </svg>
    <span id="soundtrackLabel" class="soundtrack-label">تشغيل الموسيقى</span>
  </button>

  <div class="grain" aria-hidden="true"></div>
</body>
</html>
