  <link rel="preload" as="image" href="assets/wash-left.webp" type="image/webp" crossorigin />

<body class="is-locked">
  <noscript><div class="noscript">هذه الدعوة التفاعلية تحتاج إلى تفعيل JavaScript لفتح الظرف. <a href="#welcome">تفاصيل الدعوة</a></div></noscript>

  <main id="experience" class="experience exact-experience" aria-label="دعوة عقد قران عمر ومروة">
    <section id="welcome" class="stage exact-stage" aria-label="دعوة عقد القران - الصفحة الأولى">
      <div class="stage-art exact-art-wrap">
        <img class="exact-page-art" src="assets/option2-page1.png" width="425" height="960" alt="الصفحة الأولى من الدعوة بتصميم Regal Dusk Architecture" fetchpriority="high" decoding="async" />
      </div>
    </section>

    <section id="date" class="stage exact-stage" aria-label="موعد ومكان عقد القران - الصفحة الثانية">
      <div class="stage-art exact-art-wrap exact-art-wrap--maps">
        <img class="exact-page-art" src="assets/option2-page2.png" width="445" height="960" alt="الصفحة الثانية من الدعوة وتحتوي على التاريخ والمكان" loading="lazy" decoding="async" />
        <a id="mapsLink" class="exact-map-hotspot" href="https://www.google.com/maps/place/Le+Ciel+Hotel%D8%8C+11757%D8%8C+7+Abd+El-Wahab+El-Qady%D8%8C+11757+Salah+Salem+St,+Al+Golf,+Nasr+City,+Cairo+Governorate,+Egypt%E2%80%AD/@30.0821582,31.3225127,17z/data=!4m6!3m5!1s0x14583fe5698c7cb9:0x66550542daa335e9!8m2!3d30.0821582!4d31.3225127!16s%2Fg%2F11nfct7k2p?g_ep=Eg1tbF8yMDI2MTAyN18wIOC7DCoASAJQAg%3D%3D" target="_blank" rel="noopener noreferrer" aria-label="افتح موقع Le Ciel Hotel على خرائط Google"></a>
      </div>
    </section>

    <section id="timeline" class="stage exact-stage" aria-label="برنامج الحفل - الصفحة الثالثة">
      <div class="stage-art exact-art-wrap">
        <img class="exact-page-art" src="assets/option2-page3.png" width="429" height="960" alt="الصفحة الثالثة من الدعوة وتحتوي على برنامج الحفل وكلمات الشكر" loading="lazy" decoding="async" />
      </div>
    </section>
  </main>

  <div id="envelope" class="envelope" role="dialog" aria-modal="true" aria-label="افتح دعوة عمر ومروة">
    <div class="envelope-ambient" aria-hidden="true"></div>
    <div class="envelope-card" id="envelopeCard" aria-hidden="true">
      <div class="reveal-light" aria-hidden="true"></div>
      <div class="reveal-light reveal-light--inner" aria-hidden="true"></div>
      <div class="envelope-piece envelope-piece--sheet"></div>
      <div class="seal-light-system" aria-hidden="true">
        <span class="seal-core"></span>
        <span class="seal-spill"></span>
      </div>
      <span class="flap-glow" aria-hidden="true"></span>
      <span class="paper-glow paper-glow--body" aria-hidden="true"></span>
      <div class="flap-top" aria-hidden="true">
        <span class="flap-top__art"></span>
        <span class="paper-glow paper-glow--flap"></span>
        <span class="seam-wash seam-wash--left"><i></i></span>
        <span class="seam-wash seam-wash--right"><i></i></span>
        <span class="orn-flow orn-flow--left"><i></i></span>
        <span class="orn-flow orn-flow--right"><i></i></span>
        <span class="seal-badge"></span>
        <span class="letter-bloom"></span>
        <span class="letter-flare"><i class="letter-flare__mask"><i class="letter-flare__sweep"></i></i></span>
      </div>
    </div>
    <button id="openInvitation" class="seal-hotspot" type="button" aria-label="اضغط على ختم O and M لفتح الدعوة">
      <span class="sr-only">افتح الدعوة</span>
    </button>
  </div>

  <div class="grain" aria-hidden="true"></div>
</body>
</html>
